<!doctype html>
<!-- Shown by public/sw.js when a page cannot load without a connection. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Sem conexão · Zora</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #000;
        color: #f2efe6;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #a1a1a1;
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 999px;
        padding: 0.6rem 1.2rem;
        background: #a7f175;
        color: #0e1318;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Você está offline</h1>
    <p>O Zora precisa de internet para mostrar os conteúdos da equipe.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
