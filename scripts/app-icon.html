<!doctype html>
<!--
  Source of the app icons in public/ (PWA manifest, apple-touch-icon,
  favicon): the clay artwork in scripts/brand/app-icon.png (see
  scripts/brand/README.md), framed per variant. Regenerate with
  `node scripts/generate-icons.mjs` (needs Chrome or Edge).

  The variant is the URL hash:
    #any       rounded tile on transparent (manifest "any")
    #favicon   rounded tile, artwork zoomed in so the Z reads at 16-48 px
    #maskable  full-bleed; the artwork already keeps the Z and the cat
               inside the 80% safe zone (Android)
    #apple     full-bleed (iOS rounds the corners itself)
  The page is 512 CSS px; the script scales it to each icon size.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      /* Fixed CSS px, not vw: at small scale factors headless Chrome keeps
         a minimum window size and captures only its top-left corner. */
      .tile {
        width: 512px;
        height: 512px;
        overflow: hidden;
      }
      .tile img {
        display: block;
        width: 100%;
        height: 100%;
        transform: scale(var(--zoom, 1));
      }
      .any .tile,
      .favicon .tile {
        border-radius: 22%;
      }
      .any,
      .apple {
        --zoom: 1.25;
      }
      .favicon {
        --zoom: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="tile"><img src="brand/app-icon.png" alt="" /></div>
    <script>
      document.body.className = location.hash.slice(1) || 'any'
    </script>
  </body>
</html>
